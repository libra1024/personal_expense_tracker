name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check types
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
